# Codecov configuration
# Reference: https://docs.codecov.com/docs/codecov-yaml

codecov:
  require_ci_to_pass: false

  strict_yaml_branch: main
  notify:
    wait_for_ci: false
coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        # At least 90% of added or changed lines must be covered by tests.
        target: 90%
        threshold: 0%
        informational: false

        if_not_found: failure
comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
github_checks: false
