name: Issue Labeler

on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    - cron: 17 3 * * *
      timezone: Australia/Brisbane
  workflow_dispatch:

permissions: {}

jobs:
  label:
    permissions:
      issues: write # add bug/enhancement labels, and create them if missing
    uses: tinkerologie/.github/.github/workflows/issue-labeler.yml@8b5a48edcfc57a283ca85244a572e16ebd539571 # v1.6.0
