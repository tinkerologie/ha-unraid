name: Issue Labeler

on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    - cron: 17 3 * * *
      timezone: Australia/Brisbane
  workflow_dispatch:

permissions: {}

jobs:
  label:
    permissions:
      issues: write # add bug/enhancement labels, and create them if missing
    uses: tinkerologie/.github/.github/workflows/issue-labeler.yml@d0f9f9b745d716bd70ccd4e1f8580a1e3082b80e # v1.5.5
