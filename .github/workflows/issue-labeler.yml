name: Issue Labeler

on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    - cron: 17 3 * * 1
      timezone: Australia/Brisbane
  workflow_dispatch:

permissions: {}

jobs:
  label:
    permissions:
      issues: write # add bug/enhancement labels, and create them if missing
    uses: tinkerologie/.github/.github/workflows/issue-labeler.yml@bf6df49397202ecd15229b8f19b5ac9c4fb4e46d # shared governance
