name: Issue Labeler

on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    - cron: 17 3 * * 1
      timezone: Australia/Brisbane
  workflow_dispatch:

permissions: {}

jobs:
  label:
    permissions:
      issues: write # add bug/enhancement labels, and create them if missing
    uses: tinkerologie/.github/.github/workflows/issue-labeler.yml@7e5c22ca873253fd90c454d2d4175930fad0557b # shared governance
