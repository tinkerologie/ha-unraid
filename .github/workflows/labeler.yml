name: PR Labeler

# Path labels from .github/labeler.yml, then exactly one type label (bug or enhancement).
# The logic lives in the shared workflow; see STANDARDS.md in tinkerologie/.github.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- no PR code is checked out or run
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions: {}

jobs:
  label:
    name: Label
    uses: tinkerologie/.github/.github/workflows/pr-labeler.yml@8b5a48edcfc57a283ca85244a572e16ebd539571 # v1.6.0
    permissions:
      contents: read # read the labeler configuration
      issues: write # add and remove labels
      pull-requests: write # add and remove labels
