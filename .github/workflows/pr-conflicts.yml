name: PR Conflicts

on:
  push:
    branches: [main]
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- no PR code is checked out or run
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conflicts:
    permissions:
      contents: read # read the default branch to compute mergeability
      pull-requests: write # add/remove the conflicts label and comment on pull requests
    uses: tinkerologie/.github/.github/workflows/pr-conflicts.yml@d0f9f9b745d716bd70ccd4e1f8580a1e3082b80e # v1.5.5
