name: API Boundary

on:
  push:
    paths:
      - custom_components/unraid/**/*.py
      - script/check_api_boundary.py
  pull_request:
    paths:
      - custom_components/unraid/**/*.py
      - script/check_api_boundary.py

permissions:
  contents: read

jobs:
  api-boundary:
    name: API Boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actions/setup-python has no 3.14.2 build for the Ubuntu 26.04 runner;
      # install it with uv, as the CI Test job does.
      - name: Set up uv
        uses: astral-sh/setup-uv@2f29784424ba0f5755e2d0bbc18227082a5daff1 # v10.2.0
        with:
          version: 0.12.22

      - name: Set up Python
        run: uv python install 3.14.2

      - name: Check API boundary
        run: uv run --no-project --python 3.14.2 script/check_api_boundary.py
