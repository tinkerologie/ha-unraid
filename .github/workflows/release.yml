# yamllint disable rule:line-length
name: Release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/unraid/manifest.json
    tags:
      - v*

permissions:
  contents: read # jobs request only what they need

# One release run at a time, never cancelled: a run must not delete or publish
# a draft that another run is still filling.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  auto_tag:
    name: Tag Release
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and tag
    outputs:
      version: ${{ steps.manifest.outputs.version }}
      tag_created: ${{ steps.create_tag.outputs.created }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read version from manifest
        id: manifest
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('custom_components/unraid/manifest.json'))['version'])")

          if [ -z "$VERSION" ]; then
            echo "Version not found in manifest.json"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Manifest version: $VERSION"

      # Only release once the CHANGELOG is ready: the [Unreleased] content
      # must have been moved under a "## [VERSION]" heading matching the new
      # manifest version. A manifest bump without that section skips tagging
      # instead of publishing a release with generic fallback notes. Because
      # this workflow only triggers on manifest.json changes, the changelog
      # section must land in the same push as (or before) the manifest bump.
      - name: Check CHANGELOG has notes for this version
        id: changelog
        env:
          MANIFEST_VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          VERSION="${MANIFEST_VERSION}"

          if [ ! -f "CHANGELOG.md" ]; then
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "CHANGELOG.md not found"
            exit 0
          fi

          # Escape regex metacharacters (the dots) in the version string
          VER_RE=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          NOTES=$(awk -v ver="$VER_RE" '
            $0 ~ "^## \\[" ver "\\]" {in_section=1; next}
            in_section && $0 ~ /^## \[/ {exit}
            in_section {print}
          ' CHANGELOG.md)

          if [ -n "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
            echo "Found release notes for $VERSION in CHANGELOG.md"
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "No '## [$VERSION]' section with content found in CHANGELOG.md"
          fi

      - name: Check if tag already exists
        id: check_tag
        env:
          MANIFEST_VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          TAG="v${MANIFEST_VERSION}"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists (local)"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists (remote)"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist"
          fi

      - name: Create and push tag
        id: create_tag
        if: >-
          steps.check_tag.outputs.exists == 'false' &&
          steps.changelog.outputs.ready == 'true'
        env:
          MANIFEST_VERSION: ${{ steps.manifest.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="v${MANIFEST_VERSION}"
          echo "Creating tag $TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $TAG"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TAG"

          echo "created=true" >> $GITHUB_OUTPUT

      - name: Summary
        env:
          MANIFEST_VERSION: ${{ steps.manifest.outputs.version }}
          CHECK_TAG_EXISTS: ${{ steps.check_tag.outputs.exists }}
          CHANGELOG_READY: ${{ steps.changelog.outputs.ready }}
        run: |
          TAG="v${MANIFEST_VERSION}"
          VERSION="${MANIFEST_VERSION}"
          if [ "${CHECK_TAG_EXISTS}" = "true" ]; then
            echo "Tag $TAG already existed. No new tag created." >> $GITHUB_STEP_SUMMARY
          elif [ "${CHANGELOG_READY}" != "true" ]; then
            echo "⚠️ Tag $TAG **not** created: CHANGELOG.md has no \`## [$VERSION]\` section with content." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Move the \`[Unreleased]\` notes under a \`## [$VERSION]\` heading and push the change together with a manifest.json update to trigger the release." >> $GITHUB_STEP_SUMMARY
          else
            echo "Created and pushed tag $TAG from manifest.json version." >> $GITHUB_STEP_SUMMARY
            echo "The build and publish jobs in this workflow run will now build, attest and publish the release." >> $GITHUB_STEP_SUMMARY
          fi

  # Runs in two ways:
  #   1. Same-run after auto_tag creates a tag from a manifest version bump.
  #      Tags pushed with the default GITHUB_TOKEN do NOT trigger new workflow
  #      runs (GitHub's recursion guard), so the release must be built here —
  #      a separate tag-triggered run would never start.
  #   2. Directly from a manually pushed v* tag (auto_tag is skipped; the
  #      `!cancelled()` keeps this job eligible despite the skipped dependency).
  #
  # build has no write access to the repository: it builds unraid.zip from the
  # tag commit and signs a build provenance attestation. publish only verifies
  # and uploads those exact bytes.
  build:
    name: Build and attest
    needs: auto_tag
    if: >-
      !cancelled() && (
        startsWith(github.ref, 'refs/tags/') ||
        (needs.auto_tag.result == 'success' && needs.auto_tag.outputs.tag_created == 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the tag
      id-token: write # mint the OIDC token that signs the attestation
      attestations: write # store the build provenance attestation
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      commit: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Resolve tag
        id: tag
        env:
          AUTO_TAG_VERSION: ${{ needs.auto_tag.outputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Triggered by a manually pushed tag (e.g. refs/tags/v2026.10.5)
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # Same-run release after auto_tag created the tag
            TAG="v${AUTO_TAG_VERSION}"
          fi

          if [ "$TAG" = "v" ]; then
            echo "ERROR: could not determine release tag"
            exit 1
          fi

          VERSION="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "ref=refs/tags/$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG"

          # Check if this is a pre-release
          if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "This is a pre-release"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "This is a stable release"
          fi

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record tag commit
        id: commit
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          SHA=$(git rev-parse "${TAG}^{commit}")
          # Zip timestamps come from the tag commit, so the tag rebuilds byte-identically.
          EPOCH=$(git log -1 --format=%ct "$SHA")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "epoch=$EPOCH" >> "$GITHUB_OUTPUT"
          echo "Commit: $SHA (SOURCE_DATE_EPOCH=$EPOCH)"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.2"

      - name: Build release zip
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SOURCE_DATE_EPOCH: ${{ steps.commit.outputs.epoch }}
        run: |
          # Fails before writing anything if manifest.json does not match the tag
          # or a file the integration imports is not tracked.
          python3 script/build_release.py --tag "$TAG" --output-dir build
          unzip -l build/unraid.zip
          cat build/SHA256SUMS

      - name: Extract release notes from CHANGELOG
        env:
          VERSION_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          VERSION="${VERSION_VERSION}"

          # Check if CHANGELOG.md exists
          if [ ! -f "CHANGELOG.md" ]; then
            echo "⚠️  CHANGELOG.md not found, using default release notes"
            NOTES="Release v$VERSION of the Unraid Home Assistant integration."
          else
            # Extract release notes for this version from CHANGELOG.md
            # Look for content after "## [VERSION]" until the next version header.
            if grep -qF "## [$VERSION]" CHANGELOG.md; then
              # Escape regex metacharacters (the dots) in the version string
              VER_RE=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
              NOTES=$(awk -v ver="$VER_RE" '
                $0 ~ "^## \\[" ver "\\]" {in_section=1; next}
                in_section && $0 ~ /^## \[/ {exit}
                in_section {print}
              ' CHANGELOG.md)

              if [ -z "$NOTES" ]; then
                echo "⚠️  No release notes found for version $VERSION in CHANGELOG.md"
                NOTES="See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for details."
              fi
            else
              echo "⚠️  Version $VERSION not found in CHANGELOG.md"
              NOTES="See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for details."
            fi
          fi

          # Save to file (GitHub Actions doesn't handle multiline outputs well)
          echo "$NOTES" > build/RELEASE_NOTES.md

          # Add link to full changelog if not already present in NOTES
          if ! grep -q "See \[CHANGELOG.md\](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for details\." build/RELEASE_NOTES.md; then
            echo "" >> build/RELEASE_NOTES.md
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for details." >> build/RELEASE_NOTES.md
          fi

          # Add installation instructions
          {
            echo ""
            echo "---"
            echo ""
            echo "## 📦 Installation"
            echo ""
            echo "### Via HACS (Recommended)"
            echo ""
            echo "1. Open HACS in Home Assistant"
            echo "2. Go to **Integrations**"
            echo "3. Click the **⋮** menu → **Custom repositories**"
            echo "4. Add this repository: \`https://github.com/${GITHUB_REPOSITORY}\`"
            echo "5. Category: **Integration**"
            echo "6. Click **Add**"
            echo "7. Search for **Unraid**"
            echo "8. Click **Download**"
            echo "9. Restart Home Assistant"
            echo ""
            echo "### Manual Installation"
            echo ""
            echo "1. Download \`unraid.zip\`"
            echo "2. Extract it into \`config/custom_components/unraid/\` (the integration's files are at the root of the zip)"
            echo "3. Restart Home Assistant"
            echo "4. Add the integration via **Settings** → **Devices & Services** → **Add Integration**"
            echo ""
            echo "---"
            echo ""
            echo "**SHA256SUMS:**"
            echo "\`\`\`"
            cat build/SHA256SUMS
            echo "\`\`\`"
            echo ""
            echo "**Verify the download** (in the folder with \`unraid.zip\` and \`SHA256SUMS\`):"
            echo "\`\`\`sh"
            echo "sha256sum -c SHA256SUMS"
            echo "gh attestation verify unraid.zip --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/release.yml"
            echo "\`\`\`"
          } >> build/RELEASE_NOTES.md

          cat build/RELEASE_NOTES.md

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/unraid.zip

      - name: Stage release assets
        run: cp CHANGELOG.md build/CHANGELOG.md

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            build/unraid.zip
            build/SHA256SUMS
            build/RELEASE_NOTES.md
            build/CHANGELOG.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft, upload assets and publish the release
      attestations: read # verify the build attestation before publishing
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.build.outputs.tag }}
      COMMIT: ${{ needs.build.outputs.commit }}

    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release

      - name: Verify checksum and provenance
        working-directory: release
        run: |
          sha256sum -c SHA256SUMS
          # The command the README gives users, also bound to the tag commit.
          gh attestation verify unraid.zip \
            --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
            --source-digest "$COMMIT"

      - name: Remove a stale draft
        run: |
          # A rerun after a failed publish finds the earlier run's draft for this
          # tag: delete it (the tag stays) so the rerun starts from one clean
          # draft. Never touch a published release; its assets may be immutable.
          if ! STATE=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            echo "No release exists for $TAG"
          elif [ "$STATE" = "true" ]; then
            echo "Deleting the stale draft release for $TAG"
            gh release delete "$TAG" --yes
          else
            echo "::error::A published release already exists for $TAG; refusing to replace its assets."
            exit 1
          fi

      - name: Create draft release with assets
        working-directory: release
        env:
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          PRE_FLAG=()
          if [ "$PRERELEASE" = "true" ]; then
            PRE_FLAG=(--prerelease)
          fi

          # Immutable releases lock assets on publish, so upload to a draft first.
          gh release create "$TAG" \
            unraid.zip \
            SHA256SUMS \
            CHANGELOG.md \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md \
            "${PRE_FLAG[@]}"

      - name: Publish release
        run: gh release edit "$TAG" --draft=false

      - name: Verify the immutable release
        working-directory: release
        run: |
          IMMUTABLE=$(gh release view "$TAG" --json isImmutable --jq .isImmutable)
          if [ "$IMMUTABLE" != "true" ]; then
            echo "::warning::$TAG is not immutable. Enable Settings → General → Releases → Enable release immutability so releases get a release attestation."
            exit 0
          fi
          # GitHub creates the release attestation shortly after publication,
          # so retry for about a minute before failing.
          for attempt in $(seq 1 12); do
            if gh release verify "$TAG"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::No release attestation for immutable release $TAG."
              exit 1
            fi
            echo "Release attestation not available yet (attempt $attempt/12); retrying in 5 seconds."
            sleep 5
          done
          gh release verify-asset "$TAG" unraid.zip

      - name: Release Summary
        working-directory: release
        env:
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          CHECKSUM=$(awk '{print $1}' SHA256SUMS)
          {
            echo "## 🎉 ${TAG} Released Successfully!"
            echo ""
            echo "**Package:** \`unraid.zip\` (built and attested from \`${COMMIT}\`)"
            echo ""
            echo "**SHA256 Checksum:** \`${CHECKSUM}\`"
            echo ""
            echo "**Release URL:** https://github.com/${GH_REPO}/releases/tag/${TAG}"
            echo ""
            if [ "${PRERELEASE}" == "true" ]; then
              echo "**Type:** Pre-release"
            else
              echo "**Type:** Stable release"
            fi
            echo ""
            echo "### 📋 Next Steps"
            echo ""
            echo "- ✅ Release created and package uploaded"
            echo "- ✅ HACS and Marketplace users can now update to ${TAG} (they install \`unraid.zip\`)"
            echo "- ✅ Manual installation package available for download"
          } >> "$GITHUB_STEP_SUMMARY"
