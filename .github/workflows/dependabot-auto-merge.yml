name: Dependabot Auto-merge

# Merges Dependabot pull requests whose largest update is a patch or minor version once
# every other check has passed. Majors are left for a person. See STANDARDS.md in
# tinkerologie/.github.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  auto-merge:
    name: Auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: tinkerologie/.github/.github/workflows/dependabot-auto-merge.yml@7e5c22ca873253fd90c454d2d4175930fad0557b # shared governance
    with:
      native-auto-merge: true
    permissions:
      contents: write # merge the pull request
      pull-requests: write # merge the pull request
      checks: read # wait for check runs
      statuses: read # wait for commit statuses

  dependency-policy:
    name: Dependency Policy
    needs: auto-merge
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require current-head eligibility verification
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          RESULT: ${{ needs.auto-merge.result }}
        run: |
          if [ "$AUTHOR" = 'dependabot[bot]' ]; then
            test "$RESULT" = success
          else
            case "$RESULT" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          fi
