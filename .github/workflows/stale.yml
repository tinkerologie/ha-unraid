name: Stale

on:
  schedule:
    - cron: 41 1 * * *
      timezone: Australia/Brisbane
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    permissions:
      actions: write # actions/stale saves its progress in the Actions cache between capped runs
      issues: write # label, comment on, and close stale issues
      pull-requests: write # label, comment on, and close stale pull requests
    uses: tinkerologie/.github/.github/workflows/stale.yml@97ecbfb4a1d52169bb961e42e10e03e176f5d97b # governance hardening
