# Dependabot (tinkerologie standard: see STANDARDS.md in tinkerologie/.github)
version: 2
updates:
  # Maintain devcontainer base image
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      devcontainers-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns: ['*']

  # Maintain Python dependencies via uv (updates pyproject.toml + uv.lock)
  # Daily schedule ensures Home Assistant releases are picked up quickly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      # HA core + test framework must stay in sync — bump together
      homeassistant-stack:
        patterns:
          - homeassistant
          - pytest-homeassistant-custom-component
      # Linting / formatting tools
      linting:
        patterns:
          - ruff
          - mypy
          - pre-commit
      # Testing utilities
      testing:
        patterns:
          - pytest*
          - syrupy
          - coverage*
    # Packages pytest-homeassistant-custom-component pins exactly (==). Bumping one on
    # its own makes the lock unsatisfiable and fails the whole update run, so they
    # move only when pytest-homeassistant-custom-component does (STANDARDS.md §6).
    ignore:
      - dependency-name: pydantic
      - dependency-name: pytest
      - dependency-name: pytest-asyncio
      - dependency-name: pytest-cov
      - dependency-name: pytest-timeout
      - dependency-name: syrupy

  # Maintain frontend npm dependencies
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      frontend:
        patterns: ['*']
