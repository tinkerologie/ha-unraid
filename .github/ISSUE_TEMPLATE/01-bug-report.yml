name: Bug report
description: Report a reproducible bug, defect, or regression.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form to report a bug you can reproduce. Contributors or CodeRabbit AI (@coderabbitai plan) can use your report to make a plan.
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Which part of the project has the problem?
      options:
        - Coordinator and data updates
        - Entity platforms (sensors, binary sensors, switches, buttons, etc.)
        - Config flow and options flow
        - Upstream API client and authentication
        - Diagnostics and repairs
        - Services and actions
        - Documentation
        - CI and repository automation
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: What integration version are you running?
      placeholder: "2026.10.0"
    validations:
      required: true
  - type: input
    id: home-assistant-version
    attributes:
      label: Home Assistant version
      description: What Home Assistant core version are you running?
      placeholder: "2026.10.0"
    validations:
      required: true
  - type: input
    id: environment-version
    attributes:
      label: Environment details
      description: Device firmware version, hardware model, or upstream system details (if applicable).
      placeholder: "e.g. Firmware 2.1.0, Hardware Model X"
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what happened. Then describe what you expected.
      placeholder: Give the result you got and the result you expected.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps to reproduce the problem. Include only the necessary steps.
      placeholder: |
        1. Go to ...
        2. Trigger ...
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: relevant-logs
    attributes:
      label: Relevant log output and tracebacks
      description: Remove credentials and tokens. Paste the applicable logs, stack traces, or terminal output.
      render: shell
    validations:
      required: false
  - type: textarea
    id: root-cause-or-proposal
    attributes:
      label: Root cause analysis or proposed fix
      description: If you know which files or functions cause the problem, list them. Describe a possible correction for CodeRabbit.
      placeholder: Suspect files, functions, or potential code resolution (if known).
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, diagnostics exports, related pull requests, or environment context.
      placeholder: Any extra context to help reproduce and resolve.
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Pre-submission confirmations
      options:
        - label: I searched existing open and closed issues before opening this bug report.
          required: true
        - label: I confirm this issue targets ha-unraid, not upstream Home Assistant core or third-party hardware.
          required: true
        - label: I confirmed that no sensitive credentials (passwords, auth tokens, private keys) are included in this report.
          required: true
        - label: I read and agree to follow repository contribution rules and guidelines.
          required: true
