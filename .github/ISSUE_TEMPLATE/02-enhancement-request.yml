name: Enhancement request
description: Request a new feature, capability, or architectural improvement.
title: "[Enhancement]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this form to describe the problem, the proposed change, and how to test the change. Contributors, AI agents, and CodeRabbit AI (@coderabbitai plan) can use this information to make a plan.
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Which part of the project will this change improve?
      options:
        - Coordinator and data updates
        - Entity platforms (sensors, binary sensors, switches, buttons, etc.)
        - Config flow and options flow
        - Upstream API client and authentication
        - Diagnostics and repairs
        - Services and actions
        - Documentation
        - CI and repository automation
    validations:
      required: true
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem statement
      description: What problem does this change correct?
      placeholder: Describe the problem or the task the user needs to do.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution and architecture
      description: Describe the new function, APIs, entities, or components. Identify the modules or interfaces to change.
      placeholder: Describe the proposed design.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List the conditions that show the change is complete. Include a way to check each condition.
      placeholder: |
        - [ ] New functionality exposed with full test coverage
        - [ ] Linter and type checks pass locally
        - [ ] Documentation and CHANGELOG.md updated under [Unreleased]
    validations:
      required: true
  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives considered
      description: Share workarounds, alternative APIs, or other approaches already considered.
      placeholder: Describe other options. Give the reasons you did not select them.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add examples, API documentation links, mockups, or operational context.
      placeholder: Any supporting links, design specs, or diagrams.
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Pre-submission confirmations
      options:
        - label: I searched existing open and closed issues before opening this request.
          required: true
        - label: I confirm this request targets ha-unraid, not upstream Home Assistant core.
          required: true
        - label: I provided sufficient technical context and acceptance criteria for plan generation.
          required: true
        - label: I read and agree to follow repository contribution rules and guidelines.
          required: true
